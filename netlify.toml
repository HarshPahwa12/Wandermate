# Netlify builds the frontend/ folder of this monorepo. Netlify detects Next.js and applies its adapter itself.
# Set these in Site configuration -> Environment variables (they are baked in at build time):
#   NEXT_PUBLIC_API_URL   the Render backend URL, e.g. https://wandermate-api.onrender.com
[build]
  base = "frontend"
  command = "npm run build"
  # Relative to base ("frontend"), so this is frontend/.next. Overrides whatever the dashboard says.
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer.
  NODE_VERSION = "22"
