spring.application.name=meetup

# Hosting platforms (Render, Heroku...) tell the app which port to listen on through PORT.
server.port=${PORT:8080}

# Local secrets (DB password, JWT secret...) live in backend/.env, which is git-ignored. See .env.example.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/meetup}
spring.datasource.username=${DB_USER:meetup}
spring.datasource.password=${DB_PASSWORD:meetup}

# The hosted pooler drops idle connections and a laptop can sleep mid-session. Recycle connections well before that
# and cap every wait, so a dead socket fails in seconds and the pool replaces it instead of hanging a request.
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.data-source-properties.socketTimeout=20
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# MVP: let Hibernate manage the schema. Swap for Flyway before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Must be at least 32 bytes. Always override with JWT_SECRET outside local dev.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
app.jwt.ttl-hours=72

# Google OAuth "Web application" client id. Leave empty to disable Google sign-in.
app.google.client-id=${GOOGLE_CLIENT_ID:}

app.cors.origins=${CORS_ORIGINS:http://localhost:3000}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Password-reset emails. Leave SMTP_HOST unset to just log the reset link instead of sending (dev mode).
app.mail.host=${SMTP_HOST:}
app.mail.port=${SMTP_PORT:587}
app.mail.username=${SMTP_USERNAME:}
app.mail.password=${SMTP_PASSWORD:}
app.mail.from=${MAIL_FROM:WanderMate <no-reply@wandermate.local>}

# Chat fan-out: "simple" = in-memory broker (one server instance); "relay" = external STOMP broker such as
# RabbitMQ (with its STOMP plugin) so several instances share the same chats.
app.chat.broker=${CHAT_BROKER:simple}
app.chat.relay.host=${CHAT_RELAY_HOST:localhost}
app.chat.relay.port=${CHAT_RELAY_PORT:61613}
app.chat.relay.username=${CHAT_RELAY_USER:guest}
app.chat.relay.password=${CHAT_RELAY_PASSWORD:guest}
